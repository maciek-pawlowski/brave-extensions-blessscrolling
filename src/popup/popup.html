<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bleSSScrolling</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>bleSSScrolling</h1>

      <label class="toggle">
        <input id="enabled" type="checkbox">
        <span>Włącz filtr</span>
      </label>

      <label class="toggle">
        <input id="strictMode" type="checkbox">
        <span>Strict whitelist</span>
      </label>

      <button id="options" type="button">Ustawienia reguł</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>

    <script src="../shared/defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
